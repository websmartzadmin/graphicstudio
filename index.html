<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GrafixAnywhere</title>
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0b7cff">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Open+Sans:wght@400;700&family=Lato:wght@400;700&family=Montserrat:wght@400;700&family=Poppins:wght@400;700&family=Raleway:wght@400;700&family=Nunito:wght@400;700&family=Inter:wght@400;700&family=Oswald:wght@400;700&family=Merriweather:wght@400;700&family=Playfair+Display:wght@400;700&family=Roboto+Mono:wght@400;700&family=Bebas+Neue&family=Anton&family=Pacifico&family=Lobster&family=Dancing+Script:wght@400;700&family=Work+Sans:wght@400;700&family=Rubik:wght@400;700&family=DM+Sans:wght@400;700&family=Manrope:wght@400;700&family=Barlow:wght@400;700&family=Josefin+Sans:wght@400;700&family=Quicksand:wght@400;700&family=Lora:wght@400;700&family=PT+Serif:wght@400;700&family=Bitter:wght@400;700&family=EB+Garamond:wght@400;700&family=Libre+Baskerville:wght@400;700&family=Abril+Fatface&family=Righteous&family=Fjalla+One&family=Archivo+Black&family=Comfortaa:wght@400;700&family=Teko:wght@400;700&family=Caveat:wght@400;700&family=Satisfy&family=Great+Vibes&family=Permanent+Marker&family=Source+Code+Pro:wght@400;700&family=Space+Mono:wght@400;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#2c2c30; --panel:#343438; --panel2:#3d3d43; --line:#47474d; --line2:#54545b;
    --text:#e4e4e8; --muted:#9c9ca4; --accent:#2f7bf6; --accent2:#2568d8;
    --toolbar:#29292d; --hover:#45454c; --active:#2f7bf622; --danger:#e5484d;
    --headgrad:linear-gradient(#3b3b41,#343439);
  }
  *{box-sizing:border-box;-webkit-user-select:none;user-select:none;}
  html,body{margin:0;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:13px;color:var(--text);background:var(--bg);}
  #app{display:flex;flex-direction:column;height:100%;}

  /* Top bar */
  #topbar{display:flex;align-items:center;gap:6px;height:42px;padding:0 10px;background:var(--toolbar);border-bottom:1px solid var(--line);flex:0 0 auto;}
  #topbar .brand{font-weight:700;font-size:14px;margin-right:6px;color:#fff;}
  #docName{margin-left:auto;max-width:280px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px;color:var(--muted);padding:3px 9px;border-radius:6px;border:1px solid transparent;cursor:text;outline:none;}
  #docName:hover{color:var(--text);background:#ffffff0d;}
  #docName:focus{color:#fff;background:var(--panel2);border-color:var(--accent);cursor:text;}
  #topbar .brand small{color:var(--accent);font-weight:600;}
  .tb-group{display:flex;align-items:center;gap:2px;padding:0 6px;border-left:1px solid var(--line);height:24px;}
  .tb-group:first-of-type{border-left:none;}
  button.mbtn{background:transparent;border:none;color:var(--text);padding:5px 9px;border-radius:6px;cursor:pointer;font-size:12px;display:inline-flex;align-items:center;gap:5px;}
  button.mbtn:hover{background:var(--hover);}
  button.mbtn:disabled{opacity:.35;cursor:default;}
  .spacer{flex:1;}
  #zoomLabel{min-width:44px;text-align:center;color:var(--muted);font-variant-numeric:tabular-nums;}

  /* Selection info bar */
  #infobar{display:flex;align-items:center;gap:0;height:30px;background:linear-gradient(#2b2f35,#24272c);border-bottom:1px solid var(--line);flex:0 0 auto;font-size:11px;color:var(--muted);padding:0 10px;}
  #infobar .ib{display:flex;align-items:center;gap:5px;padding:0 12px;border-right:1px solid var(--line);height:16px;}
  #infobar .ib:last-child{border-right:none;}
  #infobar b{color:var(--text);font-weight:600;}
  #infobar #toolopts{gap:6px;height:auto;padding:2px 12px;}
  #infobar #toolopts:empty{display:none;}
  #infobar #toolopts select,#infobar #toolopts input{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:5px;padding:2px 5px;font-size:11px;height:22px;-webkit-user-select:text;user-select:text;}
  #infobar #toolopts input[type=number]{width:52px;}
  #infobar #toolopts select{appearance:none;-webkit-appearance:none;padding-right:20px;}
  #infobar #toolopts .hintmsg{color:var(--muted);font-style:italic;}
  #infobar #toolopts .tbalign{height:24px;}
  #infobar #toolopts .tbalign button{min-width:28px;padding:0;color:var(--text);}
  #infobar #toolopts .tbalign button svg{width:17px;height:17px;stroke-width:2;}
  #infobar #toolopts .tbalign button.on{background:var(--accent);color:#fff;}
  #infobar #toolopts .seg{flex:0 0 auto;overflow:visible;}
  #infobar #toolopts .seg button{flex:0 0 auto;}
  #infobar #toolopts .tbstyle button{min-width:24px;color:var(--text);font-size:12px;padding:0 4px;font-family:Georgia,serif;}
  #infobar #toolopts .tbstyle button.on{background:var(--accent);color:#fff;}
  /* Dark stepper variant for the top toolbar */
  #toolopts .stepper{background:var(--panel2);border-color:var(--line2);height:22px;flex:0 0 auto;}
  #toolopts .stepper input[type=number]{color:var(--text)!important;width:44px!important;}
  #toolopts .stepbtns{border-right-color:var(--line2);}
  #toolopts .stepbtns button{color:var(--muted);}
  #toolopts .stepbtns button:hover{color:var(--text);background:#ffffff14;}
  #infobar .k{color:var(--muted);}
  #infobar .v{color:var(--text);font-variant-numeric:tabular-nums;min-width:34px;display:inline-block;}

  #body{display:flex;flex:1;min-height:0;}

  /* Tools (two columns) */
  #tools{width:80px;background:var(--toolbar);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:6px 0;flex:0 0 auto;overflow-y:auto;overflow-x:hidden;}
  #toolgrid{display:grid;grid-template-columns:35px 35px;gap:3px;}
  .tool{width:35px;height:35px;border-radius:8px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#b4b4ba;position:relative;}
  .tool:hover{background:var(--hover);color:#fff;}
  .tool.active{background:var(--active);color:var(--accent);}
  .tool.soon{color:#63656b;cursor:default;}
  .tool.soon:hover{background:none;color:#7d7f86;}
  .tool svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  .tool .tip{position:absolute;left:44px;top:50%;transform:translateY(-50%);background:#000;color:#fff;padding:4px 8px;border-radius:5px;white-space:nowrap;font-size:11px;opacity:0;pointer-events:none;transition:opacity .12s;z-index:60;}
  .tool:hover .tip{opacity:.94;}
  .tool .tip b{color:var(--muted);font-weight:600;margin-left:6px;}
  .tool-sep{grid-column:1/3;height:1px;background:var(--line);margin:4px 6px;}

  /* Fill/Stroke swatch */
  #fsswatch{margin-top:auto;position:relative;width:56px;height:56px;margin-bottom:4px;}
  .sw{position:absolute;width:30px;height:30px;border-radius:5px;border:1px solid #000;box-shadow:0 0 0 1px var(--line2), inset 0 0 0 1px rgba(255,255,255,.15);cursor:pointer;}
  #swStroke{left:2px;top:2px;background:#1f2d4d;}
  #swStroke::after{content:'';position:absolute;inset:7px;border-radius:2px;background:var(--toolbar);box-shadow:inset 0 0 0 4px #1f2d4d;}
  #swFill{right:2px;bottom:2px;background:#5b8def;z-index:2;}
  .sw.none{background:#fff !important;}
  .sw.none::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 46%,var(--danger) 46%,var(--danger) 54%,transparent 54%);}
  #swSwap{position:absolute;right:0;top:0;width:14px;height:14px;color:var(--muted);cursor:pointer;}
  #swSwap:hover{color:var(--text);}
  #swDefault{position:absolute;left:0;bottom:0;width:14px;height:14px;cursor:pointer;}
  #swDefault div{position:absolute;width:9px;height:9px;border:1px solid var(--muted);}
  #swDefault .d1{left:0;bottom:0;background:#000;}
  #swDefault .d2{right:0;top:0;background:#fff;}
  .hiddenpick{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none;}

  /* Canvas */
  #canvasWrap{flex:1;position:relative;overflow:hidden;background:#4a4a4f;}
  #stage{position:absolute;top:18px;left:18px;width:calc(100% - 18px);height:calc(100% - 18px);display:block;}
  #rulerTop{position:absolute;top:0;left:18px;width:calc(100% - 18px);height:18px;background:#3a3a3e;border-bottom:1px solid #26262a;z-index:5;}
  #rulerLeft{position:absolute;top:18px;left:0;width:18px;height:calc(100% - 18px);background:#3a3a3e;border-right:1px solid #26262a;z-index:5;}
  #rulerCorner{position:absolute;top:0;left:0;width:18px;height:18px;background:#33333a;border-right:1px solid #26262a;border-bottom:1px solid #26262a;z-index:6;}
  #stage.tool-hand{cursor:grab;}#stage.panning{cursor:grabbing;}
  #stage.tool-select{cursor:default;}
  #stage.tool-rect,#stage.tool-roundrect,#stage.tool-ellipse,#stage.tool-line,#stage.tool-polygon,#stage.tool-star,#stage.tool-pen,#stage.tool-pencil,#stage.tool-text{cursor:crosshair;}
  /* No border/padding in the layout: they'd shrink the usable width (premature wrap) and offset the
     text — both amplified by any stretch. The accent ring is drawn with box-shadow instead. */
  #textEditor{position:absolute;display:none;background:transparent;border:none;box-shadow:0 0 0 1px var(--accent);color:#000;outline:none;resize:none;overflow:hidden;padding:0;line-height:1.15;transform-origin:0 0;z-index:30;white-space:pre;-webkit-user-select:text;user-select:text;cursor:text;}
  #cropHint{position:absolute;display:none;left:50%;top:14px;transform:translateX(-50%);background:#000d;color:#fff;padding:7px 12px;border-radius:8px;font-size:12px;z-index:40;box-shadow:0 6px 24px #0007;white-space:nowrap;}
  #cropHint b{color:var(--accent);font-weight:600;}
  #cropHint button{margin:0 3px;background:var(--accent);color:#fff;border:none;border-radius:6px;padding:3px 12px;font-size:12px;font-weight:600;cursor:pointer;}
  #cropHint button:hover{filter:brightness(1.12);}

  /* Right panels */
  #right{width:258px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;flex:0 0 auto;overflow:hidden;}
  .insptabs{display:flex;flex:0 0 auto;border-bottom:1px solid var(--line);background:var(--headgrad);}
  .insptab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:7px 2px 5px;cursor:pointer;color:var(--muted);font-size:9px;text-transform:uppercase;letter-spacing:.3px;border:none;border-right:1px solid var(--line);background:none;}
  .insptab:last-child{border-right:none;}
  .insptab svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}
  .insptab:hover{color:var(--text);}
  .insptab.on{color:var(--accent);background:var(--panel);box-shadow:inset 0 -2px 0 var(--accent);}
  /* reserve the scrollbar gutter always, so panel rows line up across tabs whether or not a tab scrolls */
  .inspbody{flex:1;overflow-y:auto;overflow-x:hidden;min-height:60px;scrollbar-gutter:stable;}
  #layersWrap{flex:0 0 auto;border-top:1px solid var(--line);max-height:40%;display:flex;flex-direction:column;overflow:hidden;}
  #layersWrap .panel-body{overflow-y:auto;padding-top:0;}
  #layersWrap .panel-head{cursor:default;}
  .emptynote{padding:16px 14px;color:var(--muted);font-size:11px;line-height:1.5;}
  .panel{border-bottom:1px solid var(--line);}
  .panel.dragging{opacity:.45;}
  .panel-head{display:flex;align-items:center;gap:6px;padding:8px 10px;background:var(--headgrad);cursor:grab;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);user-select:none;}
  .panel-head:active{cursor:grabbing;}
  .panel-head:hover{color:var(--text);}
  .panel-head .tri{font-size:9px;color:var(--muted);transition:transform .12s;width:10px;flex:0 0 auto;}
  .panel.collapsed .panel-head .tri{transform:rotate(-90deg);}
  .panel.collapsed .panel-body{display:none;}
  .panel-head .ptitle{flex:1;}
  .panel-head .pacts{display:flex;gap:1px;}
  .panel{border-bottom:1px solid var(--line);}
  .panel.dragging{opacity:.5;}
  .panel-head{display:flex;align-items:center;gap:6px;padding:8px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--headgrad);cursor:grab;user-select:none;}
  .panel-head:hover{color:var(--text);}
  .panel-head .tri{transition:transform .12s;font-size:9px;color:var(--muted);}
  .panel.collapsed .tri{transform:rotate(-90deg);}
  .panel.collapsed .panel-body{display:none;}
  .panel-head .htitle{flex:1;}
  .panel-head .hacts{display:flex;gap:1px;}
  .iconbtn{width:22px;height:22px;border:none;background:transparent;color:var(--muted);border-radius:5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;}
  .iconbtn:hover{background:var(--hover);color:var(--text);}
  .iconbtn svg{width:14px;height:14px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .panel-body{padding:2px 0 6px;}

  .row{display:flex;align-items:center;gap:8px;padding:5px 12px;}
  .row label{width:58px;color:var(--muted);font-size:11px;flex:0 0 auto;}
  .row .ctl{flex:1;min-width:0;display:flex;align-items:center;gap:6px;}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px;padding:5px 12px;}
  .szrow{display:flex;align-items:center;gap:6px;padding:5px 12px;}
  .szrow .field{flex:1;}
  .georow{display:grid;grid-template-columns:1fr 1fr 26px;gap:6px 8px;align-items:center;padding:5px 12px;}
  .georow .field{min-width:0;}
  .georow .lockbtn{justify-self:center;}
  .lockbtn{width:24px;height:24px;border:1px solid var(--line2);background:var(--panel2);color:var(--muted);border-radius:5px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex:0 0 auto;}
  .lockbtn:hover{background:var(--hover);color:var(--text);}
  .lockbtn.on{color:var(--accent);border-color:var(--accent);background:var(--active);}
  .lockbtn svg{width:13px;height:13px;}
  .insp-tab{cursor:grab;}
  .field{display:flex;align-items:center;gap:5px;}
  .field .fl{width:14px;color:var(--muted);font-size:11px;text-align:center;}
  input[type=number],input[type=text],select{background:#2b2b30;border:1px solid var(--line2);color:var(--text);border-radius:11px;padding:4px 9px;font-size:12px;width:100%;-webkit-user-select:text;user-select:text;box-shadow:inset 0 1px 2px #0003;}
  .stepper{display:inline-flex;align-items:stretch;background:#e7e3d2;border:1px solid #b6b29c;border-radius:11px;overflow:hidden;box-shadow:inset 0 1px 2px #0000001a;flex:1;min-width:0;height:24px;}
  .stepper input[type=number]{background:transparent!important;border:none!important;box-shadow:none!important;color:#1b1b1b!important;border-radius:0!important;padding:2px 4px!important;width:100%;min-width:0;-webkit-appearance:none;}
  .stepper input[type=number]::-webkit-inner-spin-button,.stepper input[type=number]::-webkit-outer-spin-button{-webkit-appearance:none;display:none;}
  .stepbtns{display:flex;flex-direction:column;flex:0 0 auto;border-right:1px solid #b6b29c;justify-content:center;}
  /* 5px each side made the arrow column ~18px of a 55px pill, leaving too little for the digits */
  .stepbtns button{border:none;background:transparent;color:#4a4a44;font-size:7px;line-height:1;padding:0 3px;cursor:pointer;height:11px;display:flex;align-items:center;justify-content:center;}
  .stepbtns button:hover{color:#000;background:#00000012;}
  input[type=number]{width:100%;}
  input:focus,select:focus{outline:none;border-color:var(--accent);}
  input[type=range]{width:100%;accent-color:var(--accent);}
  .row .ctl input[type=range].wtslider{flex:1 1 0;width:auto;min-width:0;}
  .row .ctl .stepper:has(#apW){flex:0 0 60px;}
  .fxhead{padding:7px 12px 2px;color:var(--muted);font-size:10px;text-transform:uppercase;letter-spacing:.5px;border-top:1px solid var(--line2);margin-top:5px;}
  .fxsub label{padding-left:12px;font-size:10px;opacity:.85;}
  .paintrow .fxval{min-width:26px;}
  .paintrow .ctl{gap:5px;}
  .paintrow label{width:46px;}
  .fxcolor{width:26px;height:20px;padding:0;border:1px solid var(--line2);border-radius:5px;background:none;cursor:pointer;flex:0 0 auto;}
  .fxval{font-size:10px;color:var(--muted);min-width:30px;text-align:right;flex:0 0 auto;}
  .attrstack{border-top:1px solid var(--line2);margin-top:3px;}
  .attr{display:flex;align-items:center;gap:8px;padding:7px 10px;border-bottom:1px solid var(--line2);cursor:default;}
  .attr.dragging{opacity:.4;}
  .attr.off{color:var(--muted);}
  .attrchk{width:15px;height:15px;flex:0 0 auto;accent-color:var(--accent);cursor:pointer;margin:0;}
  .attricon{width:18px;height:18px;flex:0 0 auto;color:var(--muted);display:flex;align-items:center;justify-content:center;}
  .attr:not(.off) .attricon{color:var(--text);}
  /* Effect rows read as an LED: same bulb greyed out when off, lit green when active */
  .attr.fx .attricon{color:var(--muted);}
  .attr.fx:not(.off) .attricon{color:#22c55e;}
  .attr.fx:not(.off) .attricon svg{filter:drop-shadow(0 0 3px #22c55ecc) drop-shadow(0 0 6px #22c55e66);}
  .attricon svg{width:18px;height:18px;}
  .attrname{flex:1;font-size:12px;cursor:pointer;user-select:none;}
  .attr.exp .attrname{color:var(--accent);font-weight:600;}
  .attrsw{width:36px;height:22px;border-radius:4px;border:1px solid var(--line2);flex:0 0 auto;cursor:pointer;overflow:hidden;position:relative;background-clip:padding-box;}
  .attrsw.none{background:repeating-linear-gradient(45deg,#0000 0 4px,#ffffff22 4px 8px);}
  .attrsw.bigsw{width:46px;height:26px;}
  .hexin{flex:1;min-width:0;text-transform:uppercase;}
  .geo2col{display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;padding:8px 12px 2px;}
  .geosec{padding:6px 12px 2px;}
  .geocol{display:flex;flex-direction:column;}
  .geohead{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:5px;}
  /* Centre the heading over its pill rather than the column: the pill starts 17px in (13px icon +
     4px gap) and is 56px wide, so a 56px box at that offset centres on it. Scoped to columns that
     actually hold a pill — a select or slider fills its column and needs the heading left as-is. */
  .geocol:has(.stepper) > .geohead{margin-left:17px;width:56px;text-align:center;white-space:nowrap;}
  .geofield{display:flex;align-items:center;gap:4px;margin-bottom:5px;}
  .geofield .gi{width:13px;flex:0 0 auto;color:var(--muted);font-size:11px;display:flex;align-items:center;justify-content:center;}
  .geofield .gi svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round;}
  /* 25px held only "px"/"°" (~13px) and starved the stepper of the room a 4-digit value needs */
  .geofield .unit{flex:0 0 auto;color:var(--muted);font-size:10px;width:14px;text-align:left;}
  /* Sized for the content, not the column: 4 digits plus a minus sign ("-1235"), with the arrows
     and padding accounted for. Stretching to fill left room for 6 digits and looked bloated. */
  .geofield .stepper{flex:0 0 56px;min-width:0;}
  .geofield select{flex:1;min-width:0;}
  .geofield .orientseg{flex:1;}
  .geofield.gfrange input[type=range]{flex:1;min-width:0;width:100%;margin:0;}
  .geo2col.onecol{grid-template-columns:1fr;}
  .gfbtn{width:100%;padding:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:6px;cursor:pointer;font-size:11px;margin-top:2px;}
  .gfbtn:hover{background:var(--hover);}
  .docbgsw{width:32px;height:22px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;flex:0 0 auto;box-shadow:inset 0 0 0 1px #0003;}
  .dsrow{display:flex;align-items:center;gap:6px;padding:3px 0;}
  .dsrow>label{width:54px;flex:0 0 auto;color:var(--muted);font-size:11px;}
  .dsrow .stepper{flex:1;min-width:0;}
  .dsrow>select{flex:1;min-width:0;}
  .dsrow .dstrail{flex:0 0 auto;}
  .dsrow select.dstrail{max-width:86px;flex:0 0 auto;}
  .dsswatch{width:60px;height:42px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;margin-top:4px;box-shadow:inset 0 0 0 1px #0003;}
  .dsrow .dsswatch{flex:1;width:auto;height:44px;margin-top:0;min-width:0;}
  .dsrow .dsswatch#docBg{flex:0 0 auto;width:44px;height:44px;}
  .dsswatch.transp{background:repeating-conic-gradient(#b8b8b8 0 25%,#fff 0 50%) 50%/14px 14px;}
  /* Font sample popup */
  #fontSample{position:fixed;z-index:9999;background:var(--panel2);border:1px solid var(--line2);border-radius:8px;padding:8px 12px;box-shadow:0 8px 24px #0007;color:var(--text);pointer-events:none;opacity:0;transition:opacity .12s;white-space:nowrap;max-width:90vw;overflow:hidden;}
  #fontSample.show{opacity:1;}
  #fontSample .fs-name{font-size:11px;color:var(--muted);margin-bottom:3px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;}
  #fontSample .fs-sample{font-size:26px;line-height:1.15;}
  /* Custom font picker */
  .fpickhost{flex:1;min-width:0;display:flex;}
  .fpick{position:relative;width:100%;}
  .fpick-btn{width:100%;text-align:left;background:var(--panel2) url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6"><path d="M1 1l4 4 4-4" fill="none" stroke="%239c9ca4" stroke-width="1.5"/></svg>') no-repeat right 7px center;border:1px solid var(--line2);color:var(--text);border-radius:5px;padding:3px 22px 3px 8px;font-size:13px;height:24px;line-height:16px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .fpick-btn:hover{border-color:var(--accent);}
  .fpick-panel{position:fixed;z-index:10000;background:var(--panel);border:1px solid var(--line2);border-radius:8px;box-shadow:0 12px 32px #0009;padding:6px;display:flex;flex-direction:column;max-height:min(360px,70vh);}
  .fpick-search{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:5px;padding:5px 8px;font-size:12px;margin-bottom:6px;outline:none;-webkit-user-select:text;user-select:text;}
  .fpick-search:focus{border-color:var(--accent);}
  .fpick-list{overflow-y:auto;overflow-x:hidden;}
  .fpick-item{padding:5px 10px;border-radius:5px;font-size:18px;line-height:1.35;color:var(--text);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
  .fpick-item:hover{background:var(--hover);}
  .fpick-item.sel{background:var(--accent);color:#fff;}
  .fpick-empty{padding:10px;color:var(--muted);font-size:12px;}
  /* Gradient angle dial */
  #fgAngle{width:46px;flex:0 0 auto;}
  .row .ctl .stepper:has(#fgAngle){flex:0 0 auto;}
  .graddial{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;cursor:grab;flex:0 0 auto;margin-left:auto;touch-action:none;-webkit-user-select:none;user-select:none;}
  .fgflip{flex:0 0 auto;}
  .fgsavelib{background:var(--panel2);border:1px solid var(--line2);color:var(--text);border-radius:7px;padding:3px 8px;font-size:11px;cursor:pointer;font-weight:600;flex:0 0 auto;}
  .row .ctl input[type=range][data-paint],.row .ctl input[type=range].geOpacity{flex:1 1 0;width:auto;min-width:0;}
  .fgsavelib:hover{background:var(--hover);border-color:var(--accent);color:#fff;}
  #fgStopSw{width:26px;height:26px;flex:0 0 auto;}
  #fgStopHex{flex:1 1 auto;min-width:60px;}
  .row .ctl .stepper:has(#fgStopPos){flex:0 0 50px;}
  #fgStopDel{flex:0 0 auto;padding:0;}
  .row.stoprow label{width:34px;}
  /* Library gradient editor (matches Style panel) */
  .libnote{padding:10px 12px;color:var(--muted);font-size:11px;line-height:1.5;border-top:1px solid var(--line);margin-top:8px;}
  .gradEditor .row{padding-top:3px;padding-bottom:3px;}
  .gradEditor .gradHint{padding-left:12px;padding-right:12px;margin-bottom:6px;}
  .geAngle{width:46px!important;flex:0 0 auto;}
  /* must out-rank the later .gstopsw base rule, or the swatch renders 34x22 instead of square */
  .gradEditor .geSw{width:26px;height:26px;flex:0 0 auto;}
  .geHex{flex:1 1 auto;min-width:60px;}
  .geDial{margin-left:auto;}
  .geDel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:4px;width:22px;height:24px;padding:0;cursor:pointer;}
  .geDel:disabled{opacity:.35;cursor:default;}
  .row .ctl .stepper:has(.gePos){flex:0 0 50px;}
  .row .ctl .stepper:has(.geAngle){flex:0 0 auto;}
  .gradEdActions .geDelG,.gradEdActions .ceDelC{color:var(--danger);}
  .graddial:active{cursor:grabbing;}
  .libtargetrow{display:flex;align-items:center;gap:8px;padding:8px 12px 2px;}
  .libtargetlbl{font-size:11px;color:var(--muted);}
  .seg.libtarget{flex:1;}
  .seg.libtarget button{font-size:11px;padding:5px 0;}
  #fgStopPos{width:36px;flex:0 0 auto;}
  #fgStopDel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:4px;width:22px;height:24px;cursor:pointer;}
  #fgStopDel:disabled{opacity:.35;cursor:default;}
  .attrsw.blursw{background:radial-gradient(circle at 50% 50%,var(--muted),transparent 70%);opacity:.5;cursor:default;}
  .attrhandle{flex:0 0 auto;color:var(--muted);font-size:13px;cursor:grab;letter-spacing:-2px;padding-left:2px;}
  .attrhandle:active{cursor:grabbing;}
  .attrbody{padding:4px 0 8px;background:#00000018;border-bottom:1px solid var(--line2);}
  .attrbody .row{padding-top:3px;padding-bottom:3px;}
  .swpick{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;padding:0;border:none;}
  .colorbox{display:flex;align-items:center;gap:6px;flex:1;}
  .miniswatch{width:26px;height:22px;border-radius:5px;border:1px solid var(--line2);cursor:pointer;flex:0 0 auto;}
  .miniswatch.none{background:#fff;position:relative;overflow:hidden;}
  .miniswatch.none::before{content:'';position:absolute;inset:0;background:linear-gradient(45deg,transparent 45%,var(--danger) 45%,var(--danger) 55%,transparent 55%);}
  .chip{font-size:11px;padding:3px 8px;border-radius:5px;border:1px solid var(--line2);background:var(--panel2);cursor:pointer;color:var(--muted);}
  .chip.on{color:#fff;background:var(--accent);border-color:var(--accent);}
  .seg{display:flex;border:1px solid var(--line2);border-radius:6px;overflow:hidden;}
  .seg button{flex:1;background:var(--panel2);border:none;border-right:1px solid var(--line2);color:var(--muted);padding:5px 0;cursor:pointer;font-size:11px;display:flex;align-items:center;justify-content:center;}
  .seg button:last-child{border-right:none;}
  .seg button.on{background:var(--accent);color:#fff;}
  .seg button svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .tabpane[data-pane="text"] .seg button{padding:7px 0;}
  .tabpane[data-pane="text"] .seg button svg{width:20px;height:20px;}
  .tabpane[data-pane="text"] .tbstyle button{font-size:16px;}
  .tabpane[data-pane="text"] .ctl>select,.tabpane[data-pane="text"] .ctl>.stepper,.tabpane[data-pane="text"] .ctl>.seg{flex:1;width:auto;min-width:0;}
  .tabpane[data-pane="text"] .tunit{flex:0 0 34px;width:34px;color:var(--muted);font-size:11px;text-align:left;}
  .hint{padding:14px;color:var(--muted);font-size:12px;line-height:1.5;text-align:center;}
  .btnrow{display:flex;gap:6px;padding:6px 12px;flex-wrap:wrap;}
  .btnrow button{flex:1;min-width:56px;background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:6px;border-radius:6px;cursor:pointer;font-size:11px;}
  .btnrow button:hover{background:var(--hover);}
  .sizewrap{display:flex;align-items:center;gap:6px;}
  .sizewrap .sizefields{flex:1;min-width:0;}
  .sizewrap .sizefields .geofield:last-child{margin-bottom:0;}
  .sizewrap .lockbtn{flex:0 0 auto;}
  .dssize{display:flex;align-items:center;gap:6px;}
  .dssize .dssize-rows{flex:1;min-width:0;}
  .dssize .lockbtn{flex:0 0 auto;}
  .dsrow.dgr{padding-right:30px;}
  .dsrow .dsfill{flex:1;min-width:0;}
  .geosec{padding:2px 12px 0;margin-top:8px;margin-bottom:6px;}
  .align-grid{display:grid;grid-template-columns:repeat(6,1fr);gap:5px;padding:0 12px 4px;}
  .align-grid button{background:var(--panel2);border:1px solid var(--line2);border-radius:6px;height:30px;color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .align-grid button:hover{background:var(--hover);color:var(--text);}
  .align-grid button svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .geoactions{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:8px 12px 12px;}
  .geoactions button{background:var(--panel2);border:1px solid var(--line2);color:var(--text);padding:7px 6px;border-radius:6px;cursor:pointer;font-size:11px;}
  .geoactions button:hover{background:var(--hover);}
  .geoactions button.danger{color:#ff8080;}
  .geoactions button.danger:hover{background:#e5484d22;border-color:#e5484d99;color:#ff9b9b;}
  .dashrow{display:flex;gap:5px;padding:5px 12px;}
  .dashrow .db{flex:1;height:24px;border:1px solid var(--line2);border-radius:5px;background:var(--panel2);cursor:pointer;display:flex;align-items:center;justify-content:center;}
  .dashrow .db.on{border-color:var(--accent);background:var(--active);}
  .dashrow .db svg{width:100%;height:100%;}
  .styles-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:8px 12px;}
  .styles-grid .st{height:34px;border-radius:6px;border:1px solid var(--line2);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .styles-grid .st:hover{outline:2px solid var(--accent);outline-offset:1px;}
  .styles-grid .st.stadd{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;background:var(--panel2);border-style:dashed;}
  /* pinned "no paint" swatch — an absence, so it isn't editable or deletable like a real swatch */
  .styles-grid .st.stnone{background:#fff;position:relative;overflow:hidden;}
  .styles-grid .st.stnone::after{content:'';position:absolute;left:-25%;right:-25%;top:calc(50% - 1px);height:2px;background:var(--danger);transform:rotate(-45deg);}
  .styles-grid .st.editing{outline:2px solid var(--accent);outline-offset:1px;}
  .gradEditor{margin:0;padding:4px 0 10px;border:0;border-bottom:1px solid var(--line2);border-radius:0;background:#00000018;}
  .gradEdTitle{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);margin:2px 0 6px;padding:0 12px;font-weight:600;}
  .gradRamp{height:24px;border-radius:5px;border:1px solid var(--line2);cursor:copy;box-shadow:inset 0 0 0 1px #0003;}
  .gradStops{position:relative;height:16px;margin:5px 0 2px;cursor:copy;}
  .gstop{position:absolute;top:2px;width:11px;height:11px;border-radius:3px;background:var(--c);border:1.5px solid #fff;box-shadow:0 0 0 1px #000,0 1px 2px #0008;transform:translateX(-50%);cursor:grab;}
  .gstop::before{content:"";position:absolute;top:-5px;left:50%;transform:translateX(-50%);border-left:3px solid transparent;border-right:3px solid transparent;border-bottom:4px solid #fff;}
  .gstop.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 1px 2px #0008;z-index:2;}
  .gstop.sel::before{border-bottom-color:var(--accent);}
  .gradHint{font-size:10px;color:var(--muted);margin-bottom:6px;line-height:1.4;}
  .gbar{position:relative;height:28px;border-radius:6px;border:1px solid var(--line2);margin:4px 12px 10px;cursor:copy;box-shadow:inset 0 0 0 1px #0003;}
  .gstop2{position:absolute;top:-4px;bottom:-4px;width:12px;transform:translateX(-50%);background:var(--c);border:2px solid #fff;border-radius:3px;box-shadow:0 0 0 1px #000,0 1px 3px #0009;cursor:pointer;box-sizing:border-box;}
  .gstop2:hover{border-color:#dfe6ff;}
  .gstop2.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent),0 1px 3px #0009;z-index:2;}
  #fgRamp,#fgStops{margin-left:12px;margin-right:12px;}
  .attrbody .gradHint{padding-left:12px;padding-right:12px;}
  .gstopsw{width:34px;height:22px;border-radius:4px;border:1px solid var(--line2);cursor:pointer;flex:0 0 auto;box-shadow:inset 0 0 0 1px #0003;}
  .gstophex{flex:1;min-width:0;text-transform:uppercase;}
  .gstopdel{flex:0 0 auto;background:var(--panel);border:1px solid var(--line2);color:var(--muted);border-radius:4px;padding:0 8px;height:24px;cursor:pointer;font-size:11px;}
  .gstopdel:disabled{opacity:.35;cursor:default;}
  .gradEdActions{display:flex;gap:5px;margin:14px 12px 4px;}
  .gradEdActions button{flex:1;background:var(--panel);border:1px solid var(--line2);color:var(--text);border-radius:5px;padding:5px 2px;font-size:10px;cursor:pointer;}
  .gradEdActions .gApply{background:var(--accent);color:#fff;border-color:var(--accent);}
  .gradEdActions button:hover{filter:brightness(1.15);}

  /* Layers */
  #layers{overflow-y:auto;max-height:34vh;}
  .lyr-toolbar{display:flex;align-items:center;gap:3px;padding:6px 8px;border-top:1px solid var(--line);background:var(--toolbar);}
  .lyr-toolbar .iconbtn{width:30px;height:28px;border:1px solid var(--line2);background:var(--panel2);}
  .lyr-toolbar .iconbtn:hover{background:var(--hover);color:var(--text);}
  .lyr-toolbar .iconbtn svg{width:18px;height:18px;stroke-width:1.9;}
  .lyr-toolbar .iconbtn[data-lay="del"]{margin-left:auto;}
  .lyr{border-bottom:1px solid var(--line);}
  .lyr-head{display:flex;align-items:center;gap:4px;padding:6px 8px;cursor:pointer;}
  .lyr-head:hover{background:var(--panel2);}
  .lyr.active>.lyr-head{background:var(--active);box-shadow:inset 2px 0 0 var(--accent);}
  .lyr-tri{width:20px;color:var(--muted);cursor:pointer;flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .lyr-tri svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .12s;}
  .lyr-tri.open svg{transform:rotate(90deg);}
  .lyr-tri:hover{color:var(--text);}
  .lyr-eye,.lyr-lock{width:18px;height:18px;display:flex;align-items:center;justify-content:center;color:var(--muted);border-radius:4px;cursor:pointer;flex:0 0 auto;}
  .lyr-lock{width:22px;height:22px;}
  .lyr-eye:hover,.lyr-lock:hover{background:var(--hover);color:var(--text);}
  .lyr-lock.on{color:var(--accent);}
  .lyr-name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .lyr-name[contenteditable]{outline:1px solid var(--accent);border-radius:3px;padding:0 2px;-webkit-user-select:text;user-select:text;}
  .lyr-objs{background:#00000018;padding-left:12px;}
  .lyr-empty{padding:5px 12px;color:var(--muted);font-size:11px;font-style:italic;}
  .layer{display:flex;align-items:center;gap:6px;padding:5px 10px;cursor:pointer;border-left:2px solid transparent;}
  .layer:hover{background:var(--panel2);}
  .layer.sel{background:var(--active);border-left-color:var(--accent);}
  .layer .eye{width:18px;height:18px;flex:0 0 auto;color:var(--muted);display:flex;align-items:center;justify-content:center;border-radius:4px;}
  .layer .eye:hover{background:var(--hover);}
  .layer.hidden .name{opacity:.4;}
  .layer .swatch{width:16px;height:16px;border-radius:3px;border:1px solid var(--line2);flex:0 0 auto;}
  .lyr-count{font-size:10px;color:var(--muted);flex:0 0 auto;min-width:14px;text-align:center;}
  .lyr.drop>.lyr-head{background:var(--active);box-shadow:inset 0 0 0 2px var(--accent);}
  .grow{display:flex;align-items:center;gap:5px;padding:5px 8px 5px 4px;cursor:pointer;border-left:2px solid transparent;user-select:none;}
  .grow:hover{background:var(--panel2);}
  .grow.sel{background:var(--active);border-left-color:var(--accent);}
  .grp-tri{width:18px;}
  .grow-ic{width:16px;height:16px;color:var(--muted);flex:0 0 auto;display:flex;align-items:center;justify-content:center;}
  .grow-name{flex:1;font-size:12px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text);}
  .grow .eye{margin-left:auto;}
  .grp-objs{padding-left:14px;}
  .layer{user-select:none;}
  .layer.nested{padding-left:6px;}
  .layer .name{flex:1;font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .layer .name[contenteditable]{outline:1px solid var(--accent);border-radius:3px;padding:0 2px;-webkit-user-select:text;user-select:text;}

  /* Bottom bar */
  #bottombar{height:30px;background:var(--toolbar);border-top:1px solid var(--line);display:flex;align-items:center;padding:0 10px;gap:10px;color:var(--muted);font-size:11px;flex:0 0 auto;}
  #bottombar .bgroup{display:flex;align-items:center;gap:6px;}
  #bottombar select{width:auto;padding:3px 6px;font-size:11px;}
  #bottombar input[type=range]{width:90px;}
  #bottombar .zbtn{width:22px;height:20px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);border-radius:5px;cursor:pointer;}
  #bottombar .zbtn:hover{background:var(--hover);}

  /* Graphic-style dropdowns + number steppers */
  select{appearance:none;-webkit-appearance:none;background-image:url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="10" height="6" viewBox="0 0 10 6"><path d="M1 1l4 4 4-4" fill="none" stroke="%238b929b" stroke-width="1.5"/></svg>');background-repeat:no-repeat;background-position:right 7px center;padding-right:22px;cursor:pointer;}
  input[type=number]::-webkit-inner-spin-button,input[type=number]::-webkit-outer-spin-button{opacity:1;height:22px;}
  #stage.tool-triangle{cursor:crosshair;}
  #stage.tool-zoom{cursor:zoom-in;}
  #stage.tool-zoom.zoom-out{cursor:zoom-out;}

  /* Document tabs */
  #docTabs{display:flex;align-items:flex-end;gap:2px;height:32px;background:var(--toolbar);border-bottom:1px solid var(--line);padding:0 6px;flex:0 0 auto;overflow-x:auto;overflow-y:hidden;}
  #docTabs::-webkit-scrollbar{height:0;}
  .doctab{display:flex;align-items:center;gap:6px;padding:0 6px 0 11px;min-width:104px;max-width:200px;height:26px;background:var(--panel);border:1px solid var(--line);border-bottom:none;border-radius:7px 7px 0 0;color:var(--muted);cursor:pointer;font-size:12px;white-space:nowrap;flex:0 0 auto;}
  .doctab:hover{background:var(--panel2);color:var(--text);}
  .doctab.active{background:var(--bg);color:var(--text);border-color:var(--line2);}
  .doctab .dt-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:150px;outline:none;}
  .doctab .dt-dot{width:6px;height:6px;border-radius:50%;background:var(--accent);flex:0 0 auto;display:none;}
  .doctab.dirty .dt-dot{display:block;}
  .doctab .dt-close{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:15px;line-height:1;padding:1px 4px;border-radius:4px;flex:0 0 auto;}
  .doctab .dt-close:hover{background:var(--hover);color:var(--text);}
  .dt-add{border:none;background:transparent;color:var(--muted);cursor:pointer;font-size:17px;line-height:1;padding:0 9px;border-radius:6px;align-self:center;height:24px;flex:0 0 auto;}
  .dt-add:hover{background:var(--hover);color:var(--text);}

  /* Color picker popover */
  .colorpop{position:fixed;z-index:400;background:var(--panel);border:1px solid var(--line2);border-radius:12px;padding:16px;width:260px;box-sizing:border-box;box-shadow:0 14px 44px #000b;display:none;max-height:94vh;overflow-y:auto;overflow-x:hidden;}
  .cp-sv{position:relative;width:100%;height:150px;border-radius:8px;overflow:hidden;cursor:crosshair;touch-action:none;}
  .cp-sv-hue,.cp-sv-white,.cp-sv-black{position:absolute;inset:0;}
  .cp-sv-white{background:linear-gradient(to right,#fff,rgba(255,255,255,0));}
  .cp-sv-black{background:linear-gradient(to top,#000,rgba(0,0,0,0));}
  .cp-cursor{position:absolute;width:14px;height:14px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0009;pointer-events:none;}
  .cp-slider{position:relative;height:14px;border-radius:7px;margin-top:15px;cursor:pointer;touch-action:none;}
  .cp-hue{background:linear-gradient(to right,#f00,#ff0,#0f0,#0ff,#00f,#f0f,#f00);}
  .cp-alpha{background-image:linear-gradient(45deg,#777 25%,transparent 25%),linear-gradient(-45deg,#777 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#777 75%),linear-gradient(-45deg,transparent 75%,#777 75%);background-size:8px 8px;background-position:0 0,0 4px,4px -4px,-4px 0;}
  .cp-alpha-fill{position:absolute;inset:0;border-radius:7px;}
  .cp-knob{position:absolute;top:50%;width:16px;height:16px;border:2px solid #fff;border-radius:50%;transform:translate(-50%,-50%);box-shadow:0 0 0 1px #0009;pointer-events:none;}
  .cp-hexrow{display:flex;align-items:center;gap:8px;margin-top:15px;}
  .cp-hexrow .cp-prev{width:32px;height:28px;border-radius:6px;border:1px solid var(--line2);flex:0 0 auto;}
  .cp-hexrow input{flex:1;text-transform:uppercase;height:28px;padding:0 8px;}
  .cp-eyedrop{flex:0 0 auto;width:26px;height:24px;display:flex;align-items:center;justify-content:center;background:var(--panel2);border:1px solid var(--line2);border-radius:6px;color:var(--muted);cursor:pointer;}
  .cp-eyedrop:hover{color:#fff;border-color:var(--accent);}
  .cp-eyedrop svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;}
  .cp-fields{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin-top:14px;}
  .cp-fields label{display:flex;flex-direction:column;font-size:9px;color:var(--muted);gap:4px;text-transform:uppercase;align-items:center;}
  .cp-fields .stepper{width:100%;height:28px;}
  .cp-fields .stepper input[type=number]{padding:2px 4px!important;font-size:11px;text-align:center;}
  .cp-fields .stepbtns button{padding:0 3px;}
  .cp-modes{display:flex;margin-bottom:14px;border:1px solid var(--line2);border-radius:7px;overflow:hidden;}
  /* picking one specific colour: no mode tabs, just the eyedropper */
  .cp-modes.eyeonly{border:none;justify-content:flex-end;margin-bottom:8px;}
  .cp-modes.eyeonly .cp-eyedrop{flex:0 0 32px;width:32px;height:26px;border:1px solid var(--line2);border-radius:6px;background:var(--panel2);}
  .cp-modes button{flex:1;background:var(--panel2);border:none;color:var(--muted);padding:8px 0;font-size:11px;cursor:pointer;}
  .cp-modes button.on{background:var(--accent);color:#fff;}
  .cp-modes .cp-eyedrop{flex:0 0 38px;width:38px;height:auto;padding:0;border:none;border-left:1px solid var(--line2);border-radius:0;background:var(--panel2);color:var(--muted);}
  .cp-modes .cp-eyedrop:hover{color:#fff;background:var(--accent);border-color:var(--accent);}
  .cp-grad{display:block;width:100%;}
  .cpg-ed{margin-bottom:2px;}
  .cpg-sep{border-top:1px solid var(--line2);margin:16px 0 4px;}
  .cp-grad .row{padding:5px 0;}
  .cp-grad .row label{width:42px;}
  .cp-grad .row .ctl>select{flex:1;min-width:0;}
  .cpgAngle{width:46px!important;flex:0 0 auto;}
  .row .ctl .stepper:has(.cpgAngle){flex:0 0 auto;}
  .cp-grad .graddial{margin-left:auto;}
  .cpg-bar{margin:10px 0 2px;}
  .cpg-savedlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:16px 0 6px;}
  .cpg-savedgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
  .cpg-savedgrid .cpg{height:26px;}
  .cp-swatch{width:100%;max-height:300px;overflow-y:auto;overflow-x:hidden;}
  .cp-swlabel{font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin:12px 0 6px;}
  .cp-swlabel:first-child{margin-top:2px;}
  .cp-swgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;}
  .cp-swgrid .cpg{height:26px;}
  .cpg{height:34px;border-radius:6px;border:1px solid var(--line2);cursor:pointer;box-shadow:inset 0 0 0 1px rgba(255,255,255,.06);}
  .cpg:hover,.cpg.sel{outline:2px solid var(--accent);outline-offset:1px;}
  .cpg.cpgadd{display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:20px;background:var(--panel2);border-style:dashed;}
  .ctxmenu{position:fixed;z-index:600;background:var(--panel);border:1px solid var(--line2);border-radius:7px;padding:4px;box-shadow:0 10px 30px #000a;min-width:132px;}
  .ctxmenu button{display:block;width:100%;text-align:left;background:none;border:none;color:var(--text);padding:6px 10px;font-size:12px;border-radius:4px;cursor:pointer;}
  .ctxmenu button:hover{background:var(--accent);color:#fff;}
  .ctxmenu button.danger{color:#ff6b6b;}
  .ctxmenu button.danger:hover{background:#ff3b30;color:#fff;}
  .ctxmenu button:disabled{opacity:.38;cursor:default;}
  .ctxmenu button:disabled:hover{background:none;color:var(--text);}
  .ctxsep{height:1px;background:var(--line2);margin:4px 8px;}
  #gtoast{position:fixed;left:50%;bottom:64px;transform:translateX(-50%);background:#000d;color:#fff;padding:9px 16px;border-radius:9px;font-size:12px;z-index:800;opacity:0;transition:opacity .2s;pointer-events:none;max-width:80vw;text-align:center;box-shadow:0 8px 30px #0008;}
  #gtoast.show{opacity:1;}
  #orPort svg,#orLand svg{width:22px;height:22px;}
  #orPort,#orLand{padding:7px 12px;}

  /* Menu bar */
  .menubar{display:flex;align-items:center;gap:1px;}
  .menu{position:relative;}
  .menu-title{padding:5px 11px;border-radius:6px;cursor:default;font-size:13px;color:var(--text);}
  .menu-title:hover,.menu.open>.menu-title{background:var(--hover);}
  .menu-dd{position:absolute;top:calc(100% + 5px);left:0;min-width:200px;background:var(--panel);border:1px solid var(--line2);border-radius:9px;box-shadow:0 16px 46px #000b;padding:5px;display:none;z-index:600;}
  .menu.open>.menu-dd{display:block;}
  .menu-item{padding:6px 12px;border-radius:6px;cursor:pointer;font-size:12px;display:flex;justify-content:space-between;gap:26px;white-space:nowrap;}
  .menu-item:hover{background:var(--accent);color:#fff;}
  .menu-item.disabled{color:var(--muted);opacity:.45;cursor:default;}
  .menu-item.disabled:hover{background:transparent;color:var(--muted);}
  .menu-item .sc{color:var(--muted);}
  .menu-item:hover .sc{color:#dbe6ff;}
  .menu-sep{height:1px;background:var(--line);margin:4px 8px;}

  /* Tabbed inspector */
  .insp-tabs{display:flex;background:var(--toolbar);border-bottom:1px solid var(--line);flex:0 0 auto;}
  .insp-tab{flex:1;background:transparent;border:none;border-bottom:2px solid transparent;color:var(--muted);padding:7px 2px 6px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;}
  .insp-tab svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.6;}
  .insp-tab:hover{color:var(--text);background:var(--hover);}
  .insp-tab.active{color:#fff;border-bottom-color:var(--accent);background:var(--panel);}
  .insp-pane{flex:1;overflow-y:auto;overflow-x:hidden;min-height:80px;}
  .lpanel{flex:0 0 auto;display:flex;flex-direction:column;border-top:1px solid var(--line);max-height:42%;}
  .lpanel-head{display:flex;align-items:center;justify-content:space-between;padding:7px 10px;font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);background:var(--headgrad);flex:0 0 auto;}
  .lpanel-head .hacts{display:flex;gap:1px;}

  /* Export modal */
  .modal-overlay{position:fixed;inset:0;background:#0009;z-index:500;display:none;align-items:center;justify-content:center;}
  .modal-overlay.show{display:flex;}
  .modal{background:var(--panel);border:1px solid var(--line2);border-radius:12px;width:330px;box-shadow:0 22px 64px #000b;overflow:hidden;}
  .modal-title{padding:12px 16px;font-weight:600;font-size:14px;border-bottom:1px solid var(--line);}
  .modal-body{padding:8px 4px 4px;}
  .modal-body .row label{width:82px;}
  .modal-body select,.modal-body input[type=range]{flex:1;}
  .exsize{padding:6px 16px 10px;color:var(--muted);font-size:11px;}
  .modal-actions{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--line);}
  .modal-actions button{padding:7px 16px;border-radius:7px;border:1px solid var(--line2);background:var(--panel2);color:var(--text);cursor:pointer;font-size:12px;}
  .modal-actions button.primary{background:var(--accent);border-color:var(--accent);color:#fff;}
  .modal-export{width:440px;}
  .ex-formats{display:flex;gap:6px;padding:12px 16px 8px;justify-content:center;}
  .exfmt{display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;padding:4px 3px;border-radius:8px;width:52px;}
  .exfmt.disabled{opacity:.35;cursor:default;}
  .exfmt.sel{background:var(--accent);}
  .exfmt-icon{width:34px;height:42px;border-radius:3px;background:#e8e8ea;position:relative;box-shadow:0 1px 2px #0006;overflow:hidden;}
  .exfmt-icon::before{content:'';position:absolute;top:0;right:0;border-width:0 9px 9px 0;border-style:solid;border-color:#b8b8bc #23252a #23252a #b8b8bc;}
  .exfmt-icon span{position:absolute;bottom:0;left:0;right:0;font-size:9px;font-weight:700;color:#fff;text-align:center;padding:2px 0;background:var(--fc);}
  .exfmt-name{font-size:10px;color:var(--text);}
  .exfmt.sel .exfmt-name{color:#fff;}
  .ex-desc{padding:2px 18px 10px;color:var(--muted);font-size:11px;line-height:1.4;text-align:center;min-height:30px;}
  .exrow{display:flex;align-items:center;gap:8px;padding:5px 16px;}
  /* settings grouped in an inset panel, like the reference dialog */
  .ex-group{border:1px solid var(--line2);border-radius:8px;margin:2px 16px 10px;padding:8px 0;background:#00000018;}
  .ex-group .exrow{padding:5px 12px;}
  .exrow .exlabel{width:110px;text-align:right;color:var(--text);font-size:12px;flex:0 0 auto;}
  .exrow select{width:auto;min-width:120px;}
  .exrow .exnum{width:66px;flex:0 0 auto;}
  /* .stepper defaults to flex:1 — pin it so the Scale pill doesn't stretch across the row */
  .exrow .stepper{flex:0 0 74px;}
  .exrow .exsuffix{color:var(--muted);font-size:12px;}
  .exrow .exwh{color:var(--muted);font-size:11px;margin-left:8px;}
  .exquality{flex:1;display:flex;flex-direction:column;gap:2px;}
  .exquality input[type=range]{width:100%;}
  .exqlabels{display:flex;justify-content:space-between;color:var(--muted);font-size:10px;}
  .modal-actions button:hover{filter:brightness(1.12);}

  ::-webkit-scrollbar{width:10px;height:10px;}
  ::-webkit-scrollbar-thumb{background:#3a3f46;border-radius:6px;border:2px solid var(--panel);}
  ::-webkit-scrollbar-track{background:transparent;}
</style>
</head>

  <div id="topbar">

//////////////////// HISTORY ////////////////////
function snapshot(){return JSON.stringify({doc:state.doc,shapes:state.shapes,layers:state.layers,activeLayer:state.activeLayer});}
function pushHistory(){history.push(committed);if(history.length>200)history.shift();committed=snapshot();future=[];if(tabs[activeDoc]&&!tabs[activeDoc].dirty){tabs[activeDoc].dirty=true;renderTabs();}autosave();updateUndoBtns();}

function undo(){if(!history.length)return;future.push(committed);const prev=history.pop();committed=prev;restore(prev);updateUndoBtns();autosave();}
function redo(){if(!future.length)return;history.push(committed);const nxt=future.pop();committed=nxt;restore(nxt);updateUndoBtns();autosave();}

function autosave(){sessionSave();}
function sessionSave(){
  if(!tabs.length)return;
  commitActiveTab();
  try{
    const data={v:1,active:activeDoc,tabs:tabs.map(t=>({
      doc:t.state.doc,shapes:t.state.shapes,layers:t.state.layers,activeLayer:t.state.activeLayer,
      zoom:t.state.zoom,panX:t.state.panX,panY:t.state.panY,dirty:t.dirty}))};
    localStorage.setItem('graphic-studio-session',JSON.stringify(data));
  }catch(_){}
}
function commitActiveTab(){const t=tabs[activeDoc];if(!t)return;t.state=state;t.history=history;t.future=future;t.committed=committed;}

  state=t.state;history=t.history;future=t.future;committed=t.committed;
  drag=null;penDraft=null;cropTarget=null;editing=null;expandedNodes.clear();
  ensureLayers();healCrops();

function renderTabs(){
  const bar=document.getElementById('docTabs');if(!bar)return;bar.innerHTML='';
  tabs.forEach((t,i)=>{
    const el=document.createElement('div');el.className='doctab'+(i===activeDoc?' active':'')+(t.dirty?' dirty':'');
    const dot=document.createElement('span');dot.className='dt-dot';
    const nm=document.createElement('span');nm.className='dt-name';nm.textContent=t.state.doc.name||'Untitled';
    const x=document.createElement('button');x.className='dt-close';x.textContent='×';x.title='Close document';
    x.onclick=e=>{e.stopPropagation();closeTab(i);};
    el.append(dot,nm,x);
    el.onclick=()=>{if(i!==activeDoc)activateTab(i);};
    nm.ondblclick=e=>{e.stopPropagation();editTabName(i,nm);};
    bar.append(el);
  });
  const add=document.createElement('button');add.className='dt-add';add.textContent='+';add.title='New document';
  add.onclick=()=>newTab();bar.append(add);
}
function editTabName(i,nm){
  if(i!==activeDoc)activateTab(i);
  nm.contentEditable='plaintext-only';nm.spellcheck=false;nm.focus();
  const r=document.createRange();r.selectNodeContents(nm);const s=getSelection();s.removeAllRanges();s.addRange(r);
  const commit=()=>{nm.contentEditable='false';const v=(nm.textContent||'').replace(/\s+/g,' ').trim()||'Untitled';tabs[i].state.doc.name=v;if(i===activeDoc)updateDocName();renderTabs();sessionSave();};
  nm.onblur=commit;
  nm.onkeydown=e=>{e.stopPropagation();if(e.key==='Enter'){e.preventDefault();nm.blur();}else if(e.key==='Escape'){e.preventDefault();nm.textContent=tabs[i].state.doc.name||'Untitled';nm.blur();}};

function newTab(){const st=freshState('Untitled');tabs.push(makeTab(st,false));activateTab(tabs.length-1);sessionSave();}
function closeTab(i){
  const t=tabs[i];if(!t)return;
  if(t.dirty&&!confirm('Close “'+(t.state.doc.name||'Untitled')+'”? Unsaved changes will be lost.'))return;
  if(i!==activeDoc)commitActiveTab();
  tabs.splice(i,1);
  if(!tabs.length){tabs.push(makeTab(freshState('Untitled'),false));activeDoc=0;activateTab(0,true);sessionSave();return;}
  let next=activeDoc;

function loadSession(){
  let sess=null;try{sess=JSON.parse(localStorage.getItem('graphic-studio-session')||'null');}catch(_){}
  let needFit=false;
  if(sess&&Array.isArray(sess.tabs)&&sess.tabs.length){
    tabs=sess.tabs.map(td=>{const st=freshState(td.doc&&td.doc.name);st.doc=td.doc||st.doc;if(!st.doc.name)st.doc.name='Untitled';st.shapes=td.shapes||[];st.layers=td.layers||[];st.activeLayer=td.activeLayer;st.zoom=td.zoom||1;st.panX=td.panX!=null?td.panX:80;st.panY=td.panY!=null?td.panY:60;return makeTab(st,td.dirty);});
    activeDoc=Math.max(0,Math.min(sess.active||0,tabs.length-1));
  }else{
    const st=freshState('Untitled');const old=localStorage.getItem('graphic-studio-doc');
    if(old){try{const o=JSON.parse(old);if(o.shapes&&o.shapes.length){st.doc=o.doc;if(!st.doc.name)st.doc.name='Untitled';st.shapes=o.shapes;st.layers=o.layers||[];st.activeLayer=o.activeLayer;}else seedDemoInto(st);}catch(_){seedDemoInto(st);}}

function baseStyle(){const s=state.style;const o={fill:s.fill,stroke:s.stroke,strokeWidth:s.strokeWidth,opacity:s.opacity,fillOn:s.fillOn,strokeOn:s.strokeOn,fillOpacity:s.fillOpacity??1,strokeOpacity:s.strokeOpacity??1,strokePos:s.strokePos||'center',cap:s.cap,join:s.join,miter:s.miter,dash:s.dash,blend:s.blend,visible:true,locked:false,rot:0,shear:0};if(s.fillGrad)o.fillGrad=JSON.parse(JSON.stringify(s.fillGrad));if(s.fillSolid)o.fillSolid=s.fillSolid;return o;}

let drag=null,penDraft=null,spaceDown=false,_lastClick=null;
let snapEnabled=localStorage.getItem('gs-snap')!=='0',snapGuides=null;
function selWorldBBox(){const sels=selShapes();if(!sels.length)return null;let x0=1e9,y0=1e9,x1=-1e9,y1=-1e9;for(const s of sels){const b=worldBBox(s);x0=Math.min(x0,b.x);y0=Math.min(y0,b.y);x1=Math.max(x1,b.x+b.w);y1=Math.max(y1,b.y+b.h);}return{x:x0,y:y0,w:x1-x0,h:y1-y0};}
function computeSnap(bb,raw){const th=6/state.zoom,mx=bb.x+raw.x,my=bb.y+raw.y;
  const xs=[mx,mx+bb.w/2,mx+bb.w],ys=[my,my+bb.h/2,my+bb.h];
  const xLines=[0,state.doc.w/2,state.doc.w],yLines=[0,state.doc.h/2,state.doc.h];
  for(const s of state.shapes){if(state.sel.includes(s.id)||!shapeVisible(s))continue;const b=worldBBox(s);xLines.push(b.x,b.x+b.w/2,b.x+b.w);yLines.push(b.y,b.y+b.h/2,b.y+b.h);}

window.addEventListener('pointermove',e=>{

});
window.addEventListener('pointerup',e=>{
  if(drag&&drag.mode==='penpt'){const nd=drag.node;if(nd.hOut&&Math.hypot(nd.hOut.x-nd.x,nd.hOut.y-nd.y)*state.zoom<3){nd.hOut=null;nd.hIn=null;}drag=null;renderOverlay();return;}

function startPencil(p){const s={type:'freehand',nodes:[{x:p.x,y:p.y,hIn:null,hOut:null}],closed:false,...baseStyle(),fillOn:false};addShape(s);state.sel=[s.id];drag={mode:'pencil',shape:s};render();}

function clearStepHold(){if(_stepHold){clearTimeout(_stepHold.to);if(_stepHold.iv)clearInterval(_stepHold.iv);_stepHold=null;}}
window.addEventListener('pointerup',clearStepHold);window.addEventListener('blur',clearStepHold);
function wrapSteppers(container){if(!container)return;container.querySelectorAll('input[type=number]:not(.stepped)').forEach(inp=>{inp.classList.add('stepped');if(!inp.id)inp.id='num_'+(uidc++);
  const wrap=document.createElement('span');wrap.className='stepper';const btns=document.createElement('span');btns.className='stepbtns';btns.innerHTML='<button class="su" tabindex="-1">▲</button><button class="sd" tabindex="-1">▼</button>';
  inp.parentNode.insertBefore(wrap,inp);wrap.append(btns,inp);
  const step=parseFloat(inp.step)||1,id=inp.id;
  btns.querySelector('.su').addEventListener('pointerdown',e=>{e.preventDefault();startStepHold(id,1,step);});
  btns.querySelector('.sd').addEventListener('pointerdown',e=>{e.preventDefault();startStepHold(id,-1,step);});});}
function refreshPanels(){if(!panelBodies.geometry)return;
  if(activeTab==='geometry'){fillGeometry(panelBodies.geometry);wrapSteppers(panelBodies.geometry);}
  else if(activeTab==='appearance'){fillAppearance(panelBodies.appearance);wrapSteppers(panelBodies.appearance);}
  else if(activeTab==='text'){fillText(panelBodies.text);wrapSteppers(panelBodies.text);}
  else if(activeTab==='styles'){fillStyles(panelBodies.styles);wrapSteppers(panelBodies.styles);}
  else if(activeTab==='document'){fillDocument(panelBodies.document);wrapSteppers(panelBodies.document);}
  renderLayers();
  updateFSSwatch();updateBottom();updateToolbar();updateMenuStates();}

let expandedAttrs=new Set();

  return '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="currentColor" stroke="none"/><circle cx="9.5" cy="9.5" r="3" fill="#ffffff" opacity=".55" stroke="none"/></svg>';}
function setFillType(type){for(const o of styleTargets())setFillTypeOn(o,type);setFillTypeOn(state.style,type);render();pushHistory();refreshPanels();}
function setFillTypeOn(o,type){
  if(type==='color'){let solid=o.fillSolid||(o.fillGrad&&o.fillGrad.stops&&o.fillGrad.stops[0]&&o.fillGrad.stops[0][0])||(typeof o.fill==='string'&&o.fill[0]==='#'?o.fill:'#5b8def');o.fill=solid;}
  else{if(typeof o.fill==='string'&&o.fill[0]==='#')o.fillSolid=o.fill;

function curFillGrad(){const s=curStyle();if(!s.fillGrad)s.fillGrad={type:'linear',angle:-90,stops:[['#5aa0ff',0],['#1b52c9',1]]};return s.fillGrad;}

function makeFontPicker(current,onPick){
  const wrap=document.createElement('div');wrap.className='fpick';
  const btn=document.createElement('button');btn.type='button';btn.className='fpick-btn';
  const setLbl=v=>{btn.textContent=(v||'').split(',')[0];btn.style.fontFamily=v;};
  setLbl(current);wrap.append(btn);
  let panel=null,onDoc=null,onKey=null;

    const list=document.createElement('div');list.className='fpick-list';

      const rows=FONTS.filter(f=>f.split(',')[0].toLowerCase().includes(q));

        it.onmousedown=e=>{e.preventDefault();current=f;setLbl(f);close();onPick(f);};list.append(it);}

    if(left+pw>window.innerWidth-8)left=Math.max(8,window.innerWidth-8-pw);

    }catch(_){}

function updateExportUI(){const f=exFmt,raster=f!=='svg';
  document.getElementById('exDesc').textContent=EXDESC[f]||'';
  // Resolution is pixel density — meaningless for vector SVG, so only offer it on raster formats
  document.getElementById('exDpiRow').style.display=raster?'':'none';
  document.getElementById('exQualityRow').style.display=(f==='jpeg'||f==='pdf')?'':'none';
  document.getElementById('exBgRow').style.display=(f==='png'||f==='svg'||f==='tiff')?'':'none';
  const bb=regionBBox(exV('exRegion'));
  const eff=exEffScale(f),wPx=Math.round(bb.w*eff),hPx=Math.round(bb.h*eff);
  document.getElementById('exWH').textContent='w: '+wPx+' px   h: '+hPx+' px';
  // physical size is fixed by the document (px are 96 DPI) — resolution only changes pixel density
  const phys=document.getElementById('exPhys'),sc=(+exV('exScale')||100)/100;
  phys.textContent=raster?(( bb.w*sc/96).toFixed(2)+' x '+(bb.h*sc/96).toFixed(2)+' in'):'';
  const tooBig=exTooBig(wPx,hPx);
  document.getElementById('exGo').disabled=!!tooBig;
  document.getElementById('exDesc').textContent=tooBig?tooBig:(EXDESC[f]||'');
  document.getElementById('exQVal').textContent=Math.round(document.getElementById('exQuality').value*100)+'%';}
// resolution in real DPI, whichever units the user picked
function exDpiValue(){const v=+exV('exDpi')||96;return exV('exUnits')==='cm'?v*2.54:v;}
// document px are 96 DPI, so R dpi means R/96 pixels per document px
function exEffScale(f){const dpi=(f!=='svg')?exDpiValue():96;return ((+exV('exScale')||100)/100)*(dpi/96);}
// browsers cap canvas size/area — catch it before we hand the user a blank file
function exTooBig(w,h){if(w>16384||h>16384)return 'That resolution is too large ('+w+'x'+h+' px). Max 16384 px per side — lower the resolution or scale.';
  if(w*h>1.2e8)return 'That resolution is too large ('+w+'x'+h+' px). Lower the resolution or scale.';return '';}
async function runExport(){
  const region=exV('exRegion'),format=exFmt,quality=+document.getElementById('exQuality').value,bg=exV('exBg');
  // Document px are 96 DPI (the basis doPrint uses: doc.w*72/96). Resolution sets pixel density for
  // the whole document, so the PDF page keeps its real physical size and only gets denser.
  const dpi=format!=='svg'?exDpiValue():96, eff=exEffScale(format);
  const whiteBg=region==='canvas'||format==='jpeg'||format==='pdf'||bg==='white';
  const name='graphic.'+(format==='jpeg'?'jpg':format==='tiff'?'tif':format);
  // Take the save handle NOW, while the Save… click still counts as user activation — the font
  // fetch below would consume it and get the picker denied.
  const handle=await exPickHandle(name);
  if(handle==='abort'){closeExport();return;}
  await ensureExportFonts(region==='selection'?selShapes():state.shapes);
  const{svg,w,h}=buildExportRegion(region,whiteBg);
  if(format==='svg'){await saveBlob(new Blob([svg],{type:'image/svg+xml'}),name,handle);closeExport();return;}
  const tooBig=exTooBig(Math.round(w*eff),Math.round(h*eff));
  if(tooBig){alert(tooBig);return;}
  const img=new Image();
  img.onload=()=>{const cv=document.createElement('canvas');cv.width=Math.max(1,Math.round(w*eff));cv.height=Math.max(1,Math.round(h*eff));const ctx=cv.getContext('2d');ctx.drawImage(img,0,0,cv.width,cv.height);
    if(format==='png')cv.toBlob(async b=>saveBlob(await pngWithDpi(b,dpi),name,handle),'image/png');
    else if(format==='jpeg')cv.toBlob(async b=>saveBlob(await jpegWithDpi(b,dpi),name,handle),'image/jpeg',quality);
    else if(format==='tiff'){const id2=ctx.getImageData(0,0,cv.width,cv.height);saveBlob(new Blob([buildTiff(id2.data,cv.width,cv.height,dpi,!whiteBg)],{type:'image/tiff'}),name,handle);}
    else if(format==='pdf'){const durl=cv.toDataURL('image/jpeg',quality);downloadBytes(name,buildPdf(atob(durl.split(',')[1]),cv.width,cv.height,dpi),'application/pdf',handle);}
    closeExport();};
  img.onerror=()=>{alert('Export failed.');};
  img.src='data:image/svg+xml;base64,'+btoa(unescape(encodeURIComponent(svg)));
}
async function saveDoc(){const nm=((state.doc.name||'Untitled').replace(/[\\/:*?"<>|]/g,'_'))+'.json';
  const saved=await saveBlob(new Blob([JSON.stringify({version:4,doc:state.doc,layers:state.layers,activeLayer:state.activeLayer,shapes:state.shapes,swatches:customSwatches,gradients:customGradients})],{type:'application/json'}),nm);
  if(saved){const base=String(saved).replace(/\.json$/i,'').trim();if(base){state.doc.name=base;updateDocName();}if(tabs[activeDoc])tabs[activeDoc].dirty=false;renderTabs();autosave();}}
const docNameEl=document.getElementById('docName');
function updateDocName(){if(docNameEl&&document.activeElement!==docNameEl)docNameEl.textContent=state.doc.name||'Untitled';}
docNameEl.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();docNameEl.blur();}else if(e.key==='Escape'){e.preventDefault();updateDocName();docNameEl.blur();}});
docNameEl.addEventListener('blur',()=>{const n=(docNameEl.textContent||'').replace(/\s+/g,' ').trim()||'Untitled';state.doc.name=n;docNameEl.textContent=n;renderTabs();autosave();});
function mergeLibraries(o){
  if(Array.isArray(o.gradients)){for(const g of o.gradients){const i=customGradients.findIndex(x=>x.id===g.id);if(i>=0)customGradients[i]=g;else customGradients.push(g);}saveGradients();}
  if(Array.isArray(o.swatches)){for(const c of o.swatches)if(!customSwatches.includes(c))customSwatches.push(c);saveSwatches();}}
function openFile(){document.getElementById('fileInput').click();}
document.getElementById('fileInput').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{if(f.name.endsWith('.json')){const o=JSON.parse(r.result);const nm=f.name.replace(/\.json$/i,'')||'Untitled';const st=freshState(nm);st.doc=o.doc||st.doc;st.doc.name=nm;st.shapes=o.shapes||[];st.layers=o.layers||[];st.activeLayer=o.activeLayer;mergeLibraries(o);bumpIds(st);commitActiveTab();tabs.push(makeTab(st,false));activeDoc=tabs.length-1;activateTab(activeDoc,true);dedupeIds();zoomFit();renderTabs();sessionSave();}else if(/\.svg$/i.test(f.name)){if(!importSVGShapes(r.result)){alert('Could not read that SVG — it may use features this version does not support yet.');return;}zoomFit();}else{alert('Unsupported file type — use JSON or SVG.');return;}}catch(err){alert('Could not open file: '+err.message);}};r.readAsText(f);e.target.value='';});
function newDoc(){newTab();}

//////////////////// KEYBOARD ////////////////////
window.addEventListener('keydown',e=>{
  if(editing)return;const tag=(e.target.tagName||'').toLowerCase();if(tag==='input'||tag==='select'||tag==='textarea'||e.target.isContentEditable)return;
  if(cropTarget&&(e.key==='Enter'||e.key==='Escape')){e.preventDefault();endCrop();return;}
  const mod=e.metaKey||e.ctrlKey;
  if(mod&&e.key.toLowerCase()==='z'){e.preventDefault();e.shiftKey?redo():undo();return;}
  if(mod&&e.key.toLowerCase()==='y'){e.preventDefault();redo();return;}
  if(mod&&e.key.toLowerCase()==='c'){copySel();return;}
  if(mod&&e.key.toLowerCase()==='x'){e.preventDefault();cutSel();return;}
  if(mod&&e.key.toLowerCase()==='v'){return;}/* paste handled by the 'paste' event (supports images + internal clipboard) */
  if(mod&&e.key.toLowerCase()==='d'){e.preventDefault();duplicateSel();return;}
  if(mod&&e.key.toLowerCase()==='g'){e.preventDefault();if(e.shiftKey)ungroupSel();else groupSel();return;}
  if(mod&&e.key.toLowerCase()==='a'){e.preventDefault();state.sel=state.shapes.filter(s=>s.visible!==false).map(s=>s.id);syncStyleFromSel();render();refreshPanels();return;}
  if(mod&&e.key.toLowerCase()==='s'){e.preventDefault();saveDoc();return;}
  if(mod&&e.key.toLowerCase()==='p'){e.preventDefault();openPrintModal();return;}
  if(mod&&(e.key==='='||e.key==='+')){e.preventDefault();setZoom(state.zoom*1.2);return;}
  if(mod&&(e.key==='-'||e.key==='_')){e.preventDefault();setZoom(state.zoom/1.2);return;}
  if(mod&&e.key==='0'){e.preventDefault();zoomFit();return;}
  if(e.key==='Delete'||e.key==='Backspace'){e.preventDefault();deleteSel();return;}
  if(e.key==='Escape'){if(penDraft){penDraft=null;renderOverlay();}state.sel=[];render();refreshPanels();return;}
  if(e.key==='Enter'&&penDraft){commitPen();return;}
  if(e.key===' '){spaceDown=true;stage.classList.add('tool-hand');return;}
  if(state.tool==='zoom'&&(e.metaKey||e.altKey)){stage.classList.add('zoom-out');}
  if(['ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].includes(e.key)&&state.sel.length){e.preventDefault();const d=e.shiftKey?10:1;const dx=e.key==='ArrowLeft'?-d:e.key==='ArrowRight'?d:0;const dy=e.key==='ArrowUp'?-d:e.key==='ArrowDown'?d:0;for(const s of selShapes())translateShape(s,dx,dy);render();updateStatus();clearTimeout(window._nudge);window._nudge=setTimeout(()=>{pushHistory();refreshPanels();},400);return;}
  const t=TOOLS.find(t=>t.key&&t.key.toLowerCase()===e.key.toLowerCase());if(t)setTool(t.id);
});
window.addEventListener('keyup',e=>{if(e.key===' '){spaceDown=false;if(state.tool!=='hand')stage.classList.remove('tool-hand');}if(!e.metaKey&&!e.altKey)stage.classList.remove('zoom-out');});
stage.addEventListener('dblclick',e=>{if(penDraft){commitPen();return;}if(cropTarget){endCrop();return;}const id=targetId(e.target)||(hitTest(toSVG(e.clientX,e.clientY))||{}).id;const sh=id&&state.shapes.find(x=>x.id===id);if(sh&&sh.type==='image')startCrop(sh);});

//////////////////// MENU BAR ////////////////////
const MENUS=[
  {name:'File',items:[['New','',newDoc],['Open…','',openFile],['Save','⌘S',saveDoc],'-',['Export…','',openExportModal],['Print…','⌘P',openPrintModal]]},
  {name:'Edit',items:[['Undo','⌘Z',undo,'undo'],['Redo','⇧⌘Z',redo,'redo'],'-',['Cut','⌘X',cutSel],['Copy','⌘C',copySel],['Paste','⌘V',doPaste],['Duplicate','⌘D',duplicateSel],['Delete','⌫',deleteSel],'-',['Select All','⌘A',selectAll]]},
  {name:'Arrange',items:[
    ['Bring to Front','',()=>arrange('front')],['Bring Forward','',()=>moveLayer(1)],['Send Backward','',()=>moveLayer(-1)],['Send to Back','',()=>arrange('back')],'-',
    ['Align Left','',()=>align('left')],['Align Center','',()=>align('hcenter')],['Align Right','',()=>align('right')],['Align Top','',()=>align('top')],['Align Middle','',()=>align('vcenter')],['Align Bottom','',()=>align('bottom')],'-',
    ['Distribute Horizontally','',()=>distribute('h')],['Distribute Vertically','',()=>distribute('v')],'-',
    ['Group','',groupSel],['Ungroup','',ungroupSel],['Lock','',lockSel],['Unlock All','',unlockAll],'-',
    ['Duplicate','',duplicateSel],['Delete','',deleteSel]]},
  {name:'Modify',items:[
    ['Union','',()=>booleanOp('union'),'bool'],['Subtract','',()=>booleanOp('subtract'),'bool'],['Intersect','',null],['Exclude','',()=>booleanOp('exclude'),'bool'],['Divide','',null],'-',
    ['Join Paths','',null],['Outline Stroke','',null],['Reverse Path Direction','',null],'-',
    ['Make Compound Path','',null],['Convert to Objects','',splitTextToLetters],'-',
    ['Artwork Size…','',openArtworkSize],['Canvas Size…','',openCanvasSize]]},
  {name:'View',items:[['Zoom In','⌘+',()=>setZoom(state.zoom*1.2)],['Zoom Out','⌘−',()=>setZoom(state.zoom/1.2)],['Fit to Window','⌘0',zoomFit],'-',['Snap to Guides','',()=>{snapEnabled=!snapEnabled;localStorage.setItem('gs-snap',snapEnabled?'1':'0');buildMenus();},'snap'],'-',['Reset Panel Layout','',()=>{localStorage.removeItem('gs-panels');buildPanels();}]]},
  {name:'Help',items:[['Keyboard Shortcuts','',showShortcuts],['About GrafixAnywhere','',showAbout]]},
];
function buildMenus(){const bar=document.getElementById('menubar');bar.innerHTML='';
  MENUS.forEach(m=>{const menu=document.createElement('div');menu.className='menu';
    const title=document.createElement('div');title.className='menu-title';title.textContent=m.name;
    const dd=document.createElement('div');dd.className='menu-dd';
    m.items.forEach(it=>{if(it==='-'){const s=document.createElement('div');s.className='menu-sep';dd.append(s);return;}
      const sc=it[1],fn=it[2],act=it[3];const label=(act==='snap'?(snapEnabled?'✓ ':'   '):'')+it[0];
      const mi=document.createElement('div');mi.className='menu-item'+(fn?'':' disabled');if(act)mi.dataset.act=act;mi.innerHTML=`<span>${label}</span><span class="sc">${sc||''}</span>`;
      if(fn)mi.onclick=e=>{e.stopPropagation();closeMenus();fn();};dd.append(mi);});
    title.onclick=e=>{e.stopPropagation();const open=menu.classList.contains('open');closeMenus();if(!open)menu.classList.add('open');};
    title.onmouseenter=()=>{if(document.querySelector('.menu.open')){closeMenus();menu.classList.add('open');}};
    menu.append(title,dd);bar.append(menu);});
  updateUndoBtns();updateMenuStates();
}
function closeMenus(){document.querySelectorAll('.menu.open').forEach(m=>m.classList.remove('open'));}
function updateMenuStates(){const ok=selShapes().filter(s=>['rect','ellipse','polygon','star','path','freehand'].includes(s.type)).length>=2;document.querySelectorAll('.menu-item[data-act="bool"]').forEach(mi=>mi.classList.toggle('disabled',!ok));}
document.addEventListener('click',closeMenus);
function showShortcuts(){alert('Keyboard shortcuts\n\nTools:  V Select · A Triangle · R Rectangle · E Ellipse · L Line · G Polygon · S Star · T Text · P Pen · N Pencil · H Hand\n\nEdit:  Ctrl/⌘Z Undo · Shift+Ctrl/⌘Z Redo · Ctrl/⌘C-V Copy/Paste · Ctrl/⌘D Duplicate · Ctrl/⌘A Select All · Ctrl/⌘S Save · Delete Remove\n\nCanvas:  Arrows Nudge (Shift = 10px) · Space+drag or Hand Pan · Scroll Zoom · Shift while drawing = constrain');}
function showAbout(){alert('GrafixAnywhere\nA browser-based vector editor inspired by Graphic / iDraw.\n\nRuns entirely in your browser — your work auto-saves locally, and there is nothing to install.\n\nCopyright 2026 David M. Smith. All Rights Reserved.');}

//////////////////// WIRING ////////////////////
document.getElementById('exCancel').onclick=closeExport;
document.getElementById('exGo').onclick=runExport;
document.getElementById('exportModal').onclick=e=>{if(e.target.id==='exportModal')closeExport();};
['exRegion','exScale','exDpi'].forEach(id=>{const el2=document.getElementById(id);if(el2)el2.onchange=updateExportUI;});
document.getElementById('exScale').oninput=updateExportUI;document.getElementById('exDpi').oninput=updateExportUI;document.getElementById('exQuality').oninput=updateExportUI;
document.getElementById('btnZoomIn').onclick=()=>setZoom(state.zoom*1.2);
document.getElementById('btnZoomOut').onclick=()=>setZoom(state.zoom/1.2);
document.getElementById('btnZoomFit').onclick=zoomFit;
document.getElementById('csCancel').onclick=closeCanvas;
document.getElementById('csGo').onclick=applyCsModal;
document.getElementById('canvasModal').onclick=e=>{if(e.target.id==='canvasModal')closeCanvas();};
(function(){const bl=document.getElementById('bBlend');bl.innerHTML=BLENDS.map(b=>`<option value="${b}">${b}</option>`).join('');bl.onchange=()=>applyStyle('blend',bl.value,true);
  const op=document.getElementById('bOpacity');op.oninput=()=>{applyStyle('opacity',+op.value,false);document.getElementById('bOpacityV').textContent=Math.round(op.value*100)+'%';};op.onchange=()=>applyStyle('opacity',+op.value,true);})();

//////////////////// INIT ////////////////////
function init(){seedLibraryDefaults();buildStage();buildTools();buildMenus();buildPanels();setToolUI();loadSession();}

  st.layers=[{id:bg,name:'Background',visible:true,locked:false},{id:ct,name:'Content',visible:true,locked:false}];
  st.activeLayer=ct;
  st.shapes=[
  {id:uid(),layerId:bg,type:'rect',name:'Card',x:120,y:120,w:560,h:360,rx:24,fill:'url(#g-blue)',stroke:'#1b52c9',strokeWidth:2,opacity:1,fillOn:true,strokeOn:true,cap:'round',join:'round',miter:4,dash:'',blend:'normal',visible:true,rot:0,shear:0},
  {id:uid(),layerId:bg,type:'ellipse',name:'Accent',x:470,y:70,w:180,h:180,fill:'url(#g-orange)',stroke:'#fff',strokeWidth:0,opacity:.95,fillOn:true,strokeOn:false,cap:'round',join:'round',miter:4,dash:'',blend:'normal',visible:true,rot:0,shear:0},
  {id:uid(),layerId:ct,type:'star',name:'Star',x:180,y:180,w:120,h:120,sides:5,starRatio:.45,fill:'url(#g-gold)',stroke:'#f59f00',strokeWidth:2,opacity:1,fillOn:true,strokeOn:true,cap:'round',join:'round',miter:4,dash:'',blend:'normal',visible:true,rot:0,shear:0},

];}
